services:
  claude-code:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: claude-code

    # Keep container running
    stdin_open: true
    tty: true

    # Mount local directories to container
    volumes:
      # Persist Claude Code configuration and login (CLAUDE_CONFIG_DIR)
      - claude-config:/home/claude/.claude
      # Persist bash history (HISTFILE points into this directory)
      - claude-bash-history:/home/claude/.history

    # Environment variables
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      # Other potentially needed environment variables
      - TERM=xterm-256color

    # Network mode
    network_mode: bridge

    # Restart policy
    restart: unless-stopped

    # Resource limits (optional, adjust as needed)
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 8G
        reservations:
          cpus: '2'
          memory: 4G

# Define persistent volumes
volumes:
  claude-config:
    driver: local
  claude-bash-history:
    driver: local
