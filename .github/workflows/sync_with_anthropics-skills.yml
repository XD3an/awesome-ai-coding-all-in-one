name: "🔄 Sync `skills` from `anthropics/skills`"

on:
  schedule:
    - cron: "0 0,12 * * *"
  workflow_dispatch:

jobs:
  sync-skills-folders:
    runs-on: ubuntu-latest

    steps:
      - name: 🔧 Configure Git and environment variables
        env:
          GIT_TOKEN: ${{ secrets.SYNC_PAT }}
        run: |
          if [ -z "$GIT_TOKEN" ]; then
            echo "❌ SYNC_PAT is missing!"
            exit 1
          fi
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'

      - name: 🧾 Checkout your repo
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: 🌐 Sparse clone skills folder into skills/
        run: |
          echo "📦 Cloning skills folder into skills/..."
          rm -rf skills
          mkdir -p skills
          git clone --depth=1 --filter=blob:none --sparse https://github.com/anthropics/skills.git temp-upstream
          cd temp-upstream
          git sparse-checkout set skills
          export UPSTREAM_COMMIT=$(git rev-parse --short HEAD)
          echo "UPSTREAM_COMMIT=${UPSTREAM_COMMIT}" >> $GITHUB_ENV
          cp -r skills/* ../skills/ || true
          cd ..
          rm -rf temp-upstream

      - name: 📦 Commit and push changes
        env:
          GIT_TOKEN: ${{ secrets.SYNC_PAT }}
        run: |
          git add skills
          git diff --cached --quiet && echo "✅ No changes to commit." && exit 0
          git commit -m "🔄 Sync skills from anthropics/skills (${UPSTREAM_COMMIT}) [bot][action]"
          git push https://x-access-token:${GIT_TOKEN}@github.com/XD3an/awesome-ai-coding-all-in-one.git HEAD:main
